<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NSIC</title>
  <script>
    // Apply the saved theme before first paint (light is the default). Must stay in sync with web/app/theme.ts.
    try { if (localStorage.getItem("nsic.theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch {}
  </script>
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/app.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
